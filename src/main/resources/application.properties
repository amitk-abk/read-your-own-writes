spring.application.name=ryow
server.port=${SERVER_PORT:8080}
ryow.window=${RYOW_WINDOW:PT1M}

app.datasource.read-write.jdbc-url=${RYOW_PRIMARY_URL:jdbc:postgresql://localhost:5432/ryow}
app.datasource.read-write.username=${RYOW_DB_USERNAME:ryow}
app.datasource.read-write.password=${RYOW_DB_PASSWORD:ryow}
app.datasource.read-write.driver-class-name=org.postgresql.Driver

app.datasource.read-only-first.jdbc-url=${RYOW_REPLICA_FIRST_URL:jdbc:postgresql://localhost:5433/ryow}
app.datasource.read-only-first.username=${RYOW_DB_USERNAME:ryow}
app.datasource.read-only-first.password=${RYOW_DB_PASSWORD:ryow}
app.datasource.read-only-first.driver-class-name=org.postgresql.Driver

app.datasource.read-only-second.jdbc-url=${RYOW_REPLICA_SECOND_URL:jdbc:postgresql://localhost:5434/ryow}
app.datasource.read-only-second.username=${RYOW_DB_USERNAME:ryow}
app.datasource.read-only-second.password=${RYOW_DB_PASSWORD:ryow}
app.datasource.read-only-second.driver-class-name=org.postgresql.Driver
